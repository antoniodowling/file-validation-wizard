name: Validate handoff
run-name: CI ${{ github.event_name }} ${{ github.event.action || 'push' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_SHA: ${{ github.sha }}

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false' }}
    name: Classify offline scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      sha: ${{ steps.scope.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: policy
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        shell: python
        run: |
          import os, runpy
          from pathlib import Path
          scope = 'full'
          policy = Path('policy/tools/docs_ci.py')
          if policy.is_file():
              scope = runpy.run_path(str(policy))['classify_environment'](os.environ, 'candidate')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"scope={scope}\nsha={os.environ['EXPECTED_SHA']}\n")
  checks:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') && needs.plan.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test merge-policy regressions
        run: node --test ci/docs-policy/*.test.cjs
      - run: python3 -m unittest discover -s ci -p 'test_docs_adapter.py'
      - run: npm ci
      - run: npm run validate:core
      - run: npm run check:readme-drift
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --workers=1 --reporter=list,html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - id: identity
        run: echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: validate
    if: ${{ always() && (github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false') }}
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: policy
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify exact validation result
        shell: python
        env:
          NEEDS: ${{ format('{{"plan":{0},"checks":{1}}}', toJSON(needs.plan), toJSON(needs.checks)) }}
        run: |
          import json, os, runpy
          from pathlib import Path
          needs = json.loads(os.environ['NEEDS'])
          policy = Path('policy/tools/docs_ci.py')
          if policy.is_file():
              trusted = runpy.run_path(str(policy))
              scope = trusted['classify_environment'](os.environ, 'candidate')
              trusted['evaluate'](needs, os.environ['EXPECTED_SHA'], scope)
          else:
              if set(needs) != {'plan', 'checks'}:
                  raise SystemExit('Missing or unexpected lane')
              for lane in needs.values():
                  if lane['result'] != 'success' or lane['outputs'].get('sha') != os.environ['EXPECTED_SHA']:
                      raise SystemExit('Bootstrap requires all exact-head lanes')
              if needs['plan']['outputs'].get('scope') != 'full':
                  raise SystemExit('Bootstrap requires full scope')
          scope = locals().get('scope', 'full')
          print('Not required — documentation-only' if scope == 'docs' else 'All mandatory validation checks passed.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Not required — documentation-only\n' if scope == 'docs' else 'All mandatory validation checks passed.\n')
