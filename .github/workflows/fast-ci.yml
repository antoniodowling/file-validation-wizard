name: Fast CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: fast-ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'converted_to_draft' && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}
jobs:
  quick:
    name: Fast source validation
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete changes and check syntax
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE:tools/docs_ci.py" > "$RUNNER_TEMP/docs_ci.py"
          if git cat-file -e "$BASE:ci/fast-ci.py" 2>/dev/null; then
            git show "$BASE:ci/fast-ci.py" > "$RUNNER_TEMP/fast-ci.py"
            python3 "$RUNNER_TEMP/fast-ci.py" "$BASE" "$HEAD" "$RUNNER_TEMP/docs_ci.py"
          else
            # Introduction always runs every fast check; candidate policy cannot
            # decide its own bootstrap route.
            git diff --check "$(git merge-base "$BASE" "$HEAD")" "$HEAD" --
            printf 'build=true\ncontrol=true\nfixtures=false\nstress=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.build == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.scope.outputs.build == 'true'
      - run: npm run build
        if: steps.scope.outputs.build == 'true'
      - name: Validate synthetic fixture families
        if: steps.scope.outputs.fixtures == 'true'
        run: >-
          npx vitest run tests/demo-files.test.ts tests/w3c-subset.test.ts
          tests/ach-candidates-integration.test.ts tests/bai2.test.ts
          tests/csv-wire.test.ts tests/mixed-findings.test.ts
          tests/nacha-fixtures.test.ts tests/nacha-expanded-fixtures.test.ts
          tests/nacha-origination-r2.test.ts tests/stress-policy.test.ts
      - run: npm run test:stress-files
        if: steps.scope.outputs.stress == 'true'
      - name: Test CI controls
        if: steps.scope.outputs.control == 'true'
        run: |
          node --test ci/docs-policy/*.test.cjs ci/source-adapter.test.cjs ci/fast-result.test.cjs
          python3 -m unittest discover -s ci -p 'test_docs_adapter.py'
          python3 -m unittest discover -s ci -p 'test_fast_ci.py'
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
